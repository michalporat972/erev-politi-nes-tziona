<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>נרשמת! · ערב פוליטי בנס ציונה</title>
<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="broadsheet.css">
<link rel="stylesheet" href="page.css">
</head>
<body>

<!-- The no-JS landing spot: Netlify redirects here after a native form POST.
     With JS on, index.html shows this same card in place and never navigates. -->
<main class="sheet">

  <div class="rail-thick"></div>
  <div class="rail-thin"></div>
  <div class="dateline">
    <span>יום שני · 5.10.2026 · 20:00</span>
    <span>קפה שוורצמן · נס ציונה</span>
  </div>

  <div class="confirm" style="margin-top: 64px;">
    <div class="confirm-mark">נרשמת!</div>
    <div class="confirm-rule"></div>
    <p class="confirm-line">נתראה ב־5.10 ב־20:00 בקפה שוורצמן.</p>
    <p class="confirm-sub">אל תשכחו: לא מדברים על פוליטיקאים.</p>
    <p class="confirm-pay">עוד לא השלמתם את התשלום? <a href="https://links.payboxapp.com/JNT7A1yJ45b" target="_blank" rel="noopener">הנה קישור לקבוצה בפייבוקס</a>.</p>
  </div>

  <p style="margin-top: 40px; font-size: 17px;"><a href="/">חזרה לדף האירוע</a></p>

  <div class="wedge">
    <div style="background: var(--color-bg);"></div>
    <div style="background: var(--color-neutral-100);"></div>
    <div style="background: var(--color-neutral-200);"></div>
    <div style="background: var(--color-neutral-300);"></div>
    <div style="background: var(--color-neutral-400);"></div>
    <div style="background: var(--color-neutral-500);"></div>
    <div style="background: var(--color-neutral-600);"></div>
    <div style="background: var(--color-neutral-700);"></div>
    <div style="background: var(--color-neutral-800);"></div>
    <div style="background: var(--color-text);"></div>
    <div class="wedge-gap"></div>
    <div style="background: var(--color-accent);"></div>
    <div style="background: var(--color-accent-2);"></div>
    <div style="background: var(--color-process-yellow);"></div>
    <div style="background: var(--color-text);"></div>
  </div>
  <div class="colophon">ערב פוליטי בלי פוליטיקאים · נס ציונה · 5.10.2026</div>

</main>
</body>
</html>
